name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: python -m pytest -q --cov=modbus_packet_decoder --cov-report=term-missing

      - name: Run CLI smoke test
        shell: python
        run: |
          import csv
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          with tempfile.TemporaryDirectory() as tmp:
              tmp = Path(tmp)
              batch = tmp / "batch.txt"
              output = tmp / "out.csv"
              batch.write_text(
                  "01 03 04 00 64 00 C8 BA 7A\n"
                  "# comment\n\n"
                  "00 01 00 00 00 06 01 03 00 00 00 0A\n",
                  encoding="utf-8",
              )
              subprocess.run([sys.executable, "modbus_packet_decoder.py", "--version"], check=True)
              subprocess.run(
                  [sys.executable, "modbus_packet_decoder.py", "00 01 00 00 00 06 01 03 00 00 00 0A"],
                  check=True,
              )
              subprocess.run(
                  [sys.executable, "modbus_packet_decoder.py", "--batch", str(batch), "--csv", str(output)],
                  check=True,
              )
              with output.open(newline="", encoding="utf-8") as stream:
                  rows = list(csv.DictReader(stream))
              assert len(rows) == 2
              assert {row["frame_type"] for row in rows} == {"RTU", "TCP"}
